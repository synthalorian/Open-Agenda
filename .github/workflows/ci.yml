name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Get dependencies
        run: |
          (cd packages/core && flutter pub get)
          (cd apps/open_agenda && flutter pub get)
      - name: Analyze
        run: |
          (cd packages/core && flutter analyze --no-fatal-infos --no-fatal-warnings)
          (cd apps/open_agenda && flutter analyze --no-fatal-infos --no-fatal-warnings)
      - name: Test
        run: |
          (cd packages/core && flutter test)
          (cd apps/open_agenda && flutter test)
